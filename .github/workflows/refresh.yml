# Daily rebuild of the DSH plugin-market index from the upstream catalog.
# The catalog package `dsh-plugin-catalog` publishes every day around 04:00
# Beijing time (checked 2026-10-17: 2026.1004 -> 2026.1017, ~03:55Z each day),
# so this runs once per day and pushes the rebuilt index.json to Pages.
name: refresh index

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 13:00 Asia/Shanghai, after the catalog release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: refresh
        run: node update.cjs

      - name: publish
        run: |
          git config user.name "dsh-plugin-index-bot"
          git config user.email "dsh-plugin-index-bot@users.noreply.github.com"
          git add index.json times-cache.json
          # Pin the whole repo (not index.json alone) so a stale node_modules or
          # untracked artifact from a previous run can never get committed.
          git diff --cached --quiet && echo "nothing to commit" || \
            git commit -m "daily index refresh $(date -u +%F)"
          git push
